<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="mask-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg-gradient)" />
  
  <!-- Subtle Grid/Pattern (Optional for texture) -->
  <path d="M0 256 H512 M256 0 V512" stroke="rgba(255,255,255,0.03)" stroke-width="2" />
  
  <!-- The Mask / Imposter Symbol -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Sleek Domino Mask -->
    <path d="M-120 -40 
             C-160 -40, -180 -10, -180 20 
             C-180 60, -140 80, -100 80 
             C-60 80, -20 40, 0 40 
             C20 40, 60 80, 100 80 
             C140 80, 180 60, 180 20 
             C180 -10, 160 -40, 120 -40 
             C80 -40, 40 -10, 0 -10 
             C-40 -10, -80 -40, -120 -40 Z" 
          fill="url(#mask-gradient)" />
          
    <!-- Eyes (Cutouts) -->
    <ellipse cx="-90" cy="20" rx="35" ry="20" fill="#1e1b4b" transform="rotate(-10, -90, 20)" />
    <ellipse cx="90" cy="20" rx="35" ry="20" fill="#1e1b4b" transform="rotate(10, 90, 20)" />
    
    <!-- Eye Highlights -->
    <circle cx="-100" cy="15" r="6" fill="#c7d2fe" />
    <circle cx="80" cy="15" r="6" fill="#c7d2fe" />
  </g>
</svg>
